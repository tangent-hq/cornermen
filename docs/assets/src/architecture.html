<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;overflow:hidden;background:#020617;}
  body{width:1600px;height:900px;font-family:"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;color:#e2e8f0;}
  text{font-family:"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;}
</style></head><body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="aw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- title -->
  <circle cx="64" cy="62" r="7" fill="#34d399"/>
  <text x="84" y="70" font-size="26" font-weight="700" fill="#f8fafc">Cornermen</text>
  <text x="64" y="102" font-size="15" fill="#94a3b8">specialists that each own an area. 1 folder of markdown. you decide.</text>

  <!-- you -->
  <rect x="690" y="40" width="220" height="74" rx="14" fill="#0f172a"/>
  <rect x="690" y="40" width="220" height="74" rx="14" fill="rgba(30,41,59,0.6)" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="800" y="73" font-size="20" font-weight="700" text-anchor="middle" fill="#f8fafc">You</text>
  <text x="800" y="96" font-size="12" text-anchor="middle" fill="#94a3b8">voice notes, yes / no</text>

  <!-- chat lines -->
  <g stroke="#475569" stroke-width="1.3" stroke-dasharray="5,5" fill="none">
    <path d="M800 114 C 800 160, 190 170, 190 236"/>
    <path d="M800 114 C 800 160, 495 170, 495 236"/>
    <path d="M800 114 L 800 236"/>
    <path d="M800 114 C 800 160, 1105 170, 1105 236"/>
    <path d="M800 114 C 800 160, 1410 170, 1410 236"/>
  </g>
  <text x="1010" y="160" font-size="12" fill="#64748b">one private chat per agent</text>

  <!-- agents -->
  <g font-size="12">
    <!-- coordinator -->
    <rect x="80" y="236" width="220" height="118" rx="10" fill="#0f172a"/>
    <rect x="80" y="236" width="220" height="118" rx="10" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="100" y="266" font-size="17" font-weight="700" fill="#fde68a">Coordinator</text>
    <text x="100" y="290" fill="#cbd5e1">chief of staff</text>
    <text x="100" y="314" fill="#94a3b8">priorities, weekly plan,</text>
    <text x="100" y="332" fill="#94a3b8">conflicts, audits</text>
    <!-- vision -->
    <rect x="385" y="236" width="220" height="118" rx="10" fill="#0f172a"/>
    <rect x="385" y="236" width="220" height="118" rx="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="405" y="266" font-size="17" font-weight="700" fill="#ddd6fe">Vision</text>
    <text x="405" y="290" fill="#cbd5e1">long-term direction</text>
    <text x="405" y="314" fill="#94a3b8">"progress, or</text>
    <text x="405" y="332" fill="#94a3b8"> just busy?"</text>
    <!-- fitness -->
    <rect x="690" y="236" width="220" height="118" rx="10" fill="#0f172a"/>
    <rect x="690" y="236" width="220" height="118" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
    <text x="710" y="266" font-size="17" font-weight="700" fill="#a7f3d0">Fitness</text>
    <text x="710" y="290" fill="#cbd5e1">trainer + nutrition</text>
    <text x="710" y="314" fill="#94a3b8">plan, check-ins,</text>
    <text x="710" y="332" fill="#94a3b8">travel fallback</text>
    <!-- builder -->
    <rect x="995" y="236" width="220" height="118" rx="10" fill="#0f172a"/>
    <rect x="995" y="236" width="220" height="118" rx="10" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="1015" y="266" font-size="17" font-weight="700" fill="#a5f3fc">Builder</text>
    <text x="1015" y="290" fill="#cbd5e1">side projects + marketing</text>
    <text x="1015" y="314" fill="#94a3b8">radar, builds, drafts</text>
    <text x="1015" y="332" fill="#94a3b8">in your voice</text>
    <!-- social -->
    <rect x="1300" y="236" width="220" height="118" rx="10" fill="#0f172a"/>
    <rect x="1300" y="236" width="220" height="118" rx="10" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.6"/>
    <text x="1320" y="266" font-size="17" font-weight="700" fill="#fecdd3">Social</text>
    <text x="1320" y="290" fill="#cbd5e1">relationships</text>
    <text x="1320" y="314" fill="#94a3b8">dates, plans, drafts.</text>
    <text x="1320" y="332" fill="#94a3b8">max 1 idea / week</text>
  </g>

  <!-- workspace boundary -->
  <rect x="50" y="410" width="1500" height="410" rx="14" fill="rgba(15,23,42,0.55)" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="9,5"/>

  <!-- writes: agent -> own folder -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M190 354 L 190 470"/><path d="M495 354 L 495 470"/><path d="M800 354 L 800 470"/>
    <path d="M1105 354 L 1105 470"/><path d="M1410 354 L 1410 470"/>
  </g>

  <rect x="68" y="424" width="850" height="26" fill="#08101f"/>
  <text x="74" y="442" font-size="16" font-weight="700" fill="#e2e8f0">~/cornermen/</text>
  <text x="236" y="442" font-size="12" fill="#94a3b8">plain markdown. readable by every agent (and by you). backed up with git.</text>

  <!-- area folders -->
  <g font-size="12">
    <rect x="80" y="470" width="220" height="170" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
    <text x="98" y="496" font-weight="700" fill="#fed7aa">coordinator/</text>
    <text x="98" y="518" fill="#e2e8f0">inbox.md  &lt;- team board</text>
    <text x="98" y="538" fill="#94a3b8">decisions.md  plans/</text>
    <g font-size="10.5">
      <text x="98" y="566" fill="#cbd5e1">[from: fitness] [to: all]</text>
      <text x="98" y="582" fill="#94a3b8">  trip Thu: travel plan on</text>
      <text x="98" y="602" fill="#cbd5e1">[from: vision] [to: builder]</text>
      <text x="98" y="618" fill="#94a3b8">  ship things in public</text>
    </g>
    <rect x="385" y="470" width="220" height="170" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.3"/>
    <text x="403" y="496" font-weight="700" fill="#ddd6fe">vision/</text>
    <text x="403" y="518" fill="#94a3b8">vision.md</text><text x="403" y="538" fill="#94a3b8">research/</text><text x="403" y="558" fill="#94a3b8">questions.md</text>
    <rect x="690" y="470" width="220" height="170" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
    <text x="708" y="496" font-weight="700" fill="#a7f3d0">fitness/</text>
    <text x="708" y="518" fill="#94a3b8">profile.md</text><text x="708" y="538" fill="#94a3b8">plan.md</text><text x="708" y="558" fill="#94a3b8">questions.md</text>
    <rect x="995" y="470" width="220" height="170" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="1013" y="496" font-weight="700" fill="#a5f3fc">builder/</text>
    <text x="1013" y="518" fill="#94a3b8">projects.md  ideas.md</text><text x="1013" y="538" fill="#94a3b8">radar.md</text><text x="1013" y="558" fill="#94a3b8">voice/</text>
    <rect x="1300" y="470" width="220" height="170" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.3"/>
    <text x="1318" y="496" font-weight="700" fill="#fecdd3">social/</text>
    <text x="1318" y="518" fill="#94a3b8">people.md</text><text x="1318" y="538" fill="#94a3b8">events.md</text><text x="1318" y="558" fill="#94a3b8">(private, stays here)</text>
    <g fill="#64748b" font-size="11">
      <text x="403" y="618">summary.md  log.md</text><text x="708" y="618">summary.md  log.md</text>
      <text x="1013" y="618">summary.md  log.md</text><text x="1318" y="618">summary.md  log.md</text>
    </g>
  </g>

  <!-- coordinator: only writer of shared -->
  <path d="M80 300 C 40 300, 40 520, 40 600 S 40 720, 76 722" stroke="#fbbf24" stroke-width="1.8" fill="none" marker-end="url(#aw)"/>
  <text x="30" y="690" font-size="11" fill="#fbbf24" transform="rotate(-90 30 690)">only writer</text>

  <!-- shared -->
  <rect x="80" y="676" width="1440" height="110" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="104" y="708" font-size="15" font-weight="700" fill="#fde68a">shared/</text>
  <text x="190" y="708" font-size="12" fill="#94a3b8">every agent reads this before it plans, advises or messages you</text>
  <g font-size="13" fill="#e2e8f0">
    <text x="104" y="752">about-me.md</text><text x="274" y="752">goals.md</text><text x="404" y="752">priorities.md</text>
    <text x="574" y="752">preferences.md</text><text x="764" y="752">system.md</text><text x="904" y="752">briefs/&lt;agent&gt;.md</text>
  </g>
  <text x="1130" y="752" font-size="12" fill="#94a3b8">rules, message budgets, schedule</text>
  <g stroke="#475569" stroke-width="1.1" stroke-dasharray="3,4" fill="none">
    <path d="M495 676 L 495 640"/><path d="M800 676 L 800 640"/><path d="M1105 676 L 1105 640"/><path d="M1410 676 L 1410 640"/><path d="M190 676 L 190 640"/>
  </g>

  <!-- footer legend -->
  <g font-size="12" fill="#94a3b8">
    <line x1="64" y1="856" x2="96" y2="856" stroke="#475569" stroke-dasharray="5,5" stroke-width="1.3"/><text x="106" y="860">chat</text>
    <line x1="170" y1="856" x2="202" y2="856" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/><text x="214" y="860">writes only its own folder</text>
    <line x1="440" y1="856" x2="472" y2="856" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#aw)"/><text x="484" y="860">single writer of shared/</text>
    <text x="760" y="860">runs on Hermes Agent profiles + cron. silent by default: [SILENT] when nothing is worth your attention.</text>
  </g>
</svg>
</body></html>
